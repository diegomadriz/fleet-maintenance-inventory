[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fleet-maintenance-inventory"
version = "0.1.0"
description = "Spare-parts demand and engine-hour maintenance planning on a masked replica"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.4.2",
  "scipy==1.17.1",
  "pandas==2.3.3", "matplotlib==3.10.8",
  "lifelines==0.30.3",
  "autograd==1.8.0", "autograd-gamma==0.5.0", "formulaic==1.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.10"]

[project.scripts]
fleet-inventory = "fleet_inventory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["out", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
