name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: fleet-inventory --output out/reproduced
      - run: python tools/check_results.py out/reproduced
